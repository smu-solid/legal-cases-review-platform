[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "review-platform"
version = "0.0.0"
description = "Independent review platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.1,<3",
  "fastapi>=0.115,<1",
  "lxml>=6.1,<7",
  "nh3>=0.2,<0.3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "httpx>=0.27,<1",
  "mypy>=1.14,<2",
  "openapi-spec-validator>=0.7,<1",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/review_platform"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "no_db: does not require the review-owned PostgreSQL test service",
  "postgres: requires the review-owned PostgreSQL test service",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["review_platform"]
mypy_path = "src"
# Alembic migration scripts are executed by Alembic, not imported as typed modules.
exclude = ['^src/review_platform/db/migrations/']

[tool.coverage.run]
branch = true
source = ["review_platform"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.bandit]
# Alembic migration scripts are reviewed DDL with hardcoded identifiers, not request-path code.
exclude_dirs = ["tests", "src/review_platform/db/migrations"]
